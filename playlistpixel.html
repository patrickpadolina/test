<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Spotify – Hip Hop Mix</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    :root {
      --spotify-green: #1ed760;
      --spotify-dark: #121212;
      --spotify-card: #181818;
      --spotify-gray: #b3b3b3;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }

    html, body {
      background-color: var(--spotify-dark);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      width: 100%;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ==========================================
       VIEW 1: PLAYLIST DASHBOARD
       ========================================== */
    #playlistView {
      display: block;
      width: 100%;
      min-height: 100vh;
      padding-bottom: 90px;
    }

    .playlist-header {
      background: linear-gradient(to bottom, #a31d1d 0%, #3a0000 70%, #121212 100%);
      padding: 40px 32px 24px;
      display: flex;
      align-items: flex-end;
      gap: 24px;
    }

    .playlist-cover {
      width: 200px;
      height: 200px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      border-radius: 4px;
      object-fit: cover;
      flex-shrink: 0;
      cursor: pointer;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
    .playlist-cover:active {
      transform: scale(0.96);
      opacity: 0.8;
    }

    .header-details { display: flex; flex-direction: column; gap: 8px; }
    .public-tag { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .playlist-title { font-size: 64px; font-weight: 900; letter-spacing: -2px; line-height: 1; margin: 4px 0; }
    .playlist-artists { font-size: 14px; color: #e0e0e0; font-weight: 500; }
    .meta-info { display: flex; align-items: center; gap: 6px; font-size: 14px; color: #e0e0e0; }

    .action-bar {
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--spotify-dark);
    }

    .action-left { display: flex; align-items: center; gap: 20px; }
    
    .play-circle-btn {
      width: 52px;
      height: 52px;
      background: var(--spotify-green);
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.1s ease;
    }
    .play-circle-btn:active { transform: scale(0.95); }

    .action-icon { background: none; border: none; color: var(--spotify-gray); cursor: pointer; }

    .table-container { padding: 0 32px 40px; }
    .song-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; color: var(--spotify-gray); }
    .song-table th { border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding: 0 16px 12px; font-size: 12px; text-transform: uppercase; }
    .song-table td { padding: 10px 16px; vertical-align: middle; }

    .song-row { border-radius: 4px; cursor: pointer; transition: background 0.2s ease; }
    .song-row:hover { background: rgba(255, 255, 255, 0.1); }
    .song-row:hover .row-index { color: #fff; }

    .song-title-cell { display: flex; align-items: center; gap: 12px; }
    .track-thumb { width: 40px; height: 40px; border-radius: 4px; object-fit: cover; }
    .track-info-text { display: flex; flex-direction: column; }
    .track-title { font-size: 15px; color: #fff; font-weight: 500; }
    .track-artist { font-size: 13px; color: var(--spotify-gray); }

    .flash-overlay {
      position: fixed;
      inset: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      z-index: 999;
      transition: opacity 0.15s ease-out;
    }

    /* ==========================================
       VIEW 2: PLAYER SCREEN
       ========================================== */
    #playerView {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 50;
      background-color: var(--spotify-dark);
      width: 100%;
      height: 100vh;
      height: 100svh;
      overflow: hidden;
    }

    .bg-blur {
      position: absolute;
      inset: -40px;
      background: radial-gradient(circle at 50% 30%, #4c2d20 0%, var(--spotify-dark) 70%);
      filter: blur(50px);
      opacity: 0.85;
      z-index: 0;
      transition: background 0.6s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .app-container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      padding: calc(env(safe-area-inset-top) + 12px) 24px calc(env(safe-area-inset-bottom) + 16px);
    }

    .top-bar { display: flex; justify-content: space-between; align-items: center; height: 44px; }
    .top-bar-btn { background: none; border: none; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; }
    .top-bar-title { font-size: 10.5px; letter-spacing: 1.2px; text-transform: uppercase; font-weight: 700; color: #d1d1d1; text-align: center; }
    .playlist-name-sub { font-size: 12px; color: #fff; font-weight: 700; margin-top: 1px; letter-spacing: 0; }

    .album-container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 12px 0; }
    .album-art {
      width: 100%;
      max-width: 330px;
      aspect-ratio: 1 / 1;
      background: #282828;
      border-radius: 8px;
      box-shadow: 0 16px 36px rgba(0,0,0,0.65);
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .album-art:active { transform: scale(0.97); }
    .album-art img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .track-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; }
    .track-details { display: flex; flex-direction: column; gap: 3px; max-width: 80%; }
    .main-track-title { font-size: 21px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .main-track-artist { font-size: 14.5px; color: var(--spotify-gray); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .heart-btn {
      background: none; border: none; cursor: pointer; padding: 4px; color: var(--spotify-gray);
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), color 0.2s ease;
    }
    .heart-btn.liked { color: var(--spotify-green); transform: scale(1.15); }
    .heart-btn.liked svg { fill: var(--spotify-green); stroke: var(--spotify-green); }

    .progress-container { margin-bottom: 12px; padding: 8px 0; cursor: pointer; }
    .progress-bar { width: 100%; height: 4px; background: rgba(255, 255, 255, 0.2); border-radius: 2px; position: relative; }
    .progress-fill { width: 0%; height: 100%; background: #fff; border-radius: 2px; position: relative; }
    .progress-container:hover .progress-fill { background: var(--spotify-green); }
    .timestamps { display: flex; justify-content: space-between; font-size: 11px; color: var(--spotify-gray); font-weight: 500; margin-top: 8px; }

    .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .control-btn { background: none; border: none; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 8px; opacity: 0.9; }
    .control-btn:active { opacity: 0.5; }
    .play-btn { width: 64px; height: 64px; background: #fff; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; color: #000; cursor: pointer; box-shadow: 0 8px 16px rgba(0,0,0,0.3); }

    .vault-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: #121212;
      z-index: 100;
      padding: calc(env(safe-area-inset-top) + 16px) 20px env(safe-area-inset-bottom);
      flex-direction: column;
      gap: 15px;
      overflow-y: auto;
    }
    .vault-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 8px; border-bottom: 1px solid #282828; }
    .clip-card { background: #181818; padding: 12px; border-radius: 8px; display: flex; flex-direction: column; gap: 10px; }
    .clip-card video, .clip-card img { width: 100%; border-radius: 6px; max-height: 220px; background: #000; object-fit: contain; }
    .clip-actions { display: flex; justify-content: space-between; align-items: center; }
    .clip-actions button { background: var(--spotify-green); border: none; color: #000; padding: 8px 16px; border-radius: 20px; font-weight: 700; font-size: 12px; cursor: pointer; }
    .clip-actions button.delete-btn { background: #e91429; color: #fff; }
  </style>
</head>

      tableBody.innerHTML = '';
      trackDatabase.forEach((track, index) => {
        const tr = document.createElement('tr');
        tr.className = 'song-row';
        tr.onclick = () => openPlayer(index);
        tr.innerHTML = `
          <td class="row-index" style="text-align: center;">${index + 1}</td>
          <td>
            <div class="song-title-cell">
              <img class="track-thumb" src="${track.cover}" alt="${track.title}">
              <div class="track-info-text">
                <span class="track-title">${track.title}</span>
                <span class="track-artist">${track.artist}</span>
              </div>
            </div>
          </td>
          <td>${track.album}</td>
          <td style="text-align: right;">${track.duration}</td>
        `;
        tableBody.appendChild(tr);
      });
    }

    function openPlayer(index) {
      currentTrackIndex = index;
      loadTrack(index);
      playlistView.style.display = 'none';
      playerView.style.display = 'block';
    }

    function closePlayer() {
      playerView.style.display = 'none';
      playlistView.style.display = 'block';
    }

    function loadTrack(index) {
      const track = trackDatabase[index];
      mainTitle.innerText = track.title;
      mainArtist.innerText = track.artist;
      mainAlbumArt.src = track.cover;
      bgBlur.style.background = track.theme;

      customAudio.src = track.audio;
      customAudio.currentTime = 0;
    }

    document.getElementById('nextTrackBtn').onclick = () => {
      currentTrackIndex = (currentTrackIndex + 1) % trackDatabase.length;
      loadTrack(currentTrackIndex);
      if (isPlaying) customAudio.play();
    };

    document.getElementById('prevTrackBtn').onclick = () => {
      currentTrackIndex = (currentTrackIndex - 1 + trackDatabase.length) % trackDatabase.length;
      loadTrack(currentTrackIndex);
      if (isPlaying) customAudio.play();
    };

    function formatTime(seconds) {
      if (isNaN(seconds)) return "0:00";
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    customAudio.onloadedmetadata = () => {
      durationElem.innerText = formatTime(customAudio.duration);
    };

    customAudio.ontimeupdate = () => {
      if (customAudio.duration) {
        const percentage = (customAudio.currentTime / customAudio.duration) * 100;
        progressFill.style.width = `${percentage}%`;
        currentTimeElem.innerText = formatTime(customAudio.currentTime);
      }
    };

    progressContainer.onclick = (e) => {
      if (customAudio.duration) {
        const rect = progressContainer.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        customAudio.currentTime = (clickX / rect.width) * customAudio.duration;
      }
    };

    heartBtn.onclick = () => {
      heartBtn.classList.toggle('liked');
      if (customAudio.paused) {
        customAudio.play().catch(err => alert("Playback error: " + err.message));
      } else {
        customAudio.pause();
      }
    };

    zoomInBtn.onclick = () => {
      if (currentZoom < 4.0) currentZoom += 0.5;
    };

    zoomOutBtn.onclick = () => {
      if (currentZoom > 0.6) currentZoom -= 0.2;
    };

    /* Shuffle Button Handler: Strictly sets 0.6x Ultrawide mode */
    halfCamBtn.onclick = async () => {
      currentZoom = 0.6;
      if (isPlaying) {
        stopRecording();
        startStream(true);
      }
    };

    /* Ultrawide Camera Stream Loader targeting Pixel 0.6x hardware */
    async function getPixelCameraStream(preferUltraWide = false) {
      const devices = await navigator.mediaDevices.enumerateDevices();
      const videoDevices = devices.filter(d => d.kind === 'videoinput');

      let selectedDeviceId = null;

      if (preferUltraWide) {
        const ultraWideDevice = videoDevices.find(d => 
          d.label.toLowerCase().includes('0.6') || 
          d.label.toLowerCase().includes('ultra') || 
          d.label.toLowerCase().includes('wide 0.6') || 
          d.label.toLowerCase().includes('back 1')
        );

        if (ultraWideDevice) {
          selectedDeviceId = ultraWideDevice.deviceId;
        }
      }

      const constraints = {
        audio: true,
        video: {
          ...(selectedDeviceId 
            ? { deviceId: { exact: selectedDeviceId } } 
            : { facingMode: { exact: "environment" } }),
          width: { ideal: 1920, max: 3840 },
          height: { ideal: 1080, max: 2160 },
          frameRate: { ideal: 30, max: 60 }
        }
      };

      const stream = await navigator.mediaDevices.getUserMedia(constraints);
      const track = stream.getVideoTracks()[0];
      const capabilities = track.getCapabilities ? track.getCapabilities() : {};

      if (preferUltraWide && capabilities.zoom) {
        try {
          const targetZoom = capabilities.zoom.min <= 0.6 ? 0.6 : capabilities.zoom.min;
          await track.applyConstraints({
            advanced: [{ zoom: targetZoom }]
          });
        } catch (e) {
          console.warn("Hardware zoom control error:", e);
        }
      }

      return stream;
    }

    async function startStream(preferWide = false) {
      try {
        await initDB();

        rawStream = await getPixelCameraStream(preferWide);

        hiddenVideo.srcObject = rawStream;
        await hiddenVideo.play();

        hiddenCanvas.width = hiddenVideo.videoWidth || 1920;
        hiddenCanvas.height = hiddenVideo.videoHeight || 1080;
        drawCanvasFrame();

        canvasStream = hiddenCanvas.captureStream(30);
        const audioTrack = rawStream.getAudioTracks()[0];
        if (audioTrack) canvasStream.addTrack(audioTrack);

        chunks = [];
        
        let options = { mimeType: 'video/mp4;codecs=avc1' };
        if (!MediaRecorder.isTypeSupported(options.mimeType)) {
          options = { mimeType: 'video/webm;codecs=vp9' };
        }

        mediaRecorder = new MediaRecorder(canvasStream, options);
        mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
        mediaRecorder.onstop = async () => {
          const videoBlob = new Blob(chunks, { type: mediaRecorder.mimeType });
          await saveMedia(videoBlob, 'video');
        };

        mediaRecorder.start(1000);
        customAudio.play();

        isPlaying = true;
        playIcon.innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
      } catch (err) {
        alert("Pixel Camera Error: " + err.message);
      }
    }

    playlistHeaderCover.onclick = async () => {
      try {
        const stream = await getPixelCameraStream(true);

        const tempVideo = document.createElement('video');
        tempVideo.srcObject = stream;
        tempVideo.setAttribute('playsinline', 'true');
        await tempVideo.play();

        await new Promise(r => setTimeout(r, 400));

        const tempCanvas = document.createElement('canvas');
        const vw = tempVideo.videoWidth || 1920;
        const vh = tempVideo.videoHeight || 1080;
        tempCanvas.width = vw;
        tempCanvas.height = vh;

        const tempCtx = tempCanvas.getContext('2d');
        tempCtx.drawImage(tempVideo, 0, 0, vw, vh);

        flashOverlay.style.opacity = '1';
        setTimeout(() => { flashOverlay.style.opacity = '0'; }, 150);

        tempCanvas.toBlob(async (blob) => {
          await saveMedia(blob, 'image');
          stream.getTracks().forEach(track => track.stop());
        }, 'image/jpeg', 0.95);

      } catch (err) {
        alert("0.6x Photo Capture Error: " + err.message);
      }
    };

    playBtn.onclick = () => {
      if (!isPlaying) {
        startStream();
      } else {
        stopRecording();
        customAudio.pause();
        isPlaying = false;
        playIcon.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"/>';
      }
    };

    function drawCanvasFrame() {
      if (!hiddenVideo.paused && !hiddenVideo.ended) {
        const vw = hiddenVideo.videoWidth;
        const vh = hiddenVideo.videoHeight;
        const cropW = vw / currentZoom;
        const cropH = vh / currentZoom;
        const cropX = (vw - cropW) / 2;
        const cropY = (vh - cropH) / 2;

        ctx.drawImage(hiddenVideo, cropX, cropY, cropW, cropH, 0, 0, hiddenCanvas.width, hiddenCanvas.height);
        animFrameId = requestAnimationFrame(drawCanvasFrame);
      }
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
      if (rawStream) rawStream.getTracks().forEach(track => track.stop());
      if (animFrameId) cancelAnimationFrame(animFrameId);
    }

    vaultTrigger.onclick = () => {
      clickCount++;
      if (clickCount === 1) {
        clickTimer = setTimeout(() => {
          clickCount = 0;
        }, 600);
      } else if (clickCount === 3) {
        clearTimeout(clickTimer);
        clickCount = 0;
        toggleVault(true);
        loadClips();
      }
    };

    function initDB() {
      return new Promise((resolve) => {
        if (db) return resolve(db);
        const req = indexedDB.open('SpotifyVaultDB', 2);
        req.onupgradeneeded = (e) => {
          const database = e.target.result;
          if (!database.objectStoreNames.contains('clips')) {
            database.createObjectStore('clips', { keyPath: 'id', autoIncrement: true });
          }
        };
        req.onsuccess = (e) => { db = e.target.result; resolve(db); };
      });
    }

    function toggleVault(show) { vaultModal.style.display = show ? 'flex' : 'none'; }

    async function saveMedia(blob, type) {
      await initDB();
      return new Promise((resolve) => {
        const tx = db.transaction('clips', 'readwrite');
        tx.objectStore('clips').add({ blob: blob, time: new Date().toLocaleTimeString(), mime: blob.type, type: type });
        tx.oncomplete = () => resolve();
      });
    }

    async function loadClips() {
      await initDB();
      const tx = db.transaction('clips', 'readonly');
      const req = tx.objectStore('clips').getAll();

      req.onsuccess = () => {
        clipList.innerHTML = '';
        if (req.result.length === 0) {
          clipList.innerHTML = '<p style="color:var(--spotify-gray); text-align:center;">No items stored in vault.</p>';
          return;
        }

        req.result.forEach((item) => {
          const card = document.createElement('div');
          card.className = 'clip-card';
          const mediaUrl = URL.createObjectURL(item.blob);
          
          let mediaElement = item.type === 'image' 
            ? `<img src="${mediaUrl}" alt="Captured Photo">`
            : `<video src="${mediaUrl}" controls playsinline></video>`;

          card.innerHTML = `
            ${mediaElement}
            <div class="clip-actions">
              <span style="font-size:12px; color:var(--spotify-gray);">${item.type === 'image' ? 'Photo' : 'Video'} • Saved ${item.time}</span>
              <div style="display:flex; gap:8px;">
                <button onclick="downloadClip(${item.id})">Save</button>
                <button class="delete-btn" onclick="deleteClip(${item.id})">Delete</button>
              </div>
            </div>
          `;
          clipList.appendChild(card);
        });
      };
    }

    async function downloadClip(id) {
      await initDB();
      const tx = db.transaction('clips', 'readonly');
      const req = tx.objectStore('clips').get(id);

      req.onsuccess = () => {
        const item = req.result;
        if (!item) return;
        const a = document.createElement('a');
        a.href = URL.createObjectURL(item.blob);
        a.download = `vault_${item.type}_${Date.now()}.${item.type === 'image' ? 'jpg' : 'mp4'}`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      };
    }

    async function deleteClip(id) {
      await initDB();
      const tx = db.transaction('clips', 'readwrite');
      tx.objectStore('clips').delete(id);
      tx.oncomplete = () => loadClips();
    }

    renderPlaylistTable();
  </script>
</body>
</html>
